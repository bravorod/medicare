version: 2

models:
  - name: fct_prescriber_risk
    description: >
      Cohort prescribers joined to their outlier score. Contains identifiers;
      do not export. Built after `partd-risk model`.
    columns:
      - name: npi
        tests: [unique, not_null]
      - name: outlier_percentile
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: rpt_outlier_by_segment
    description: Top-1% share and captured later exclusions by specialty and by state.

  - name: rpt_top_feature_mix
    description: Most influential feature among top-1% prescribers.
