[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "partd-risk"
version = "0.1.0"
description = "Medicare Part D prescribing risk analysis: industry payments, brand-name prescribing, generic-substitution savings and a peer-adjusted outlier score validated against OIG exclusions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bravorod" }]
keywords = ["medicare", "part-d", "open-payments", "bigquery", "dbt", "healthcare-analytics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "duckdb>=1.0",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "typer>=0.12",
]

[project.optional-dependencies]
bigquery = [
    "db-dtypes>=1.2",
    "google-cloud-bigquery[bqstorage,pandas]>=3.20",
]
dbt = [
    "dbt-core>=1.12,<1.13",
    "dbt-bigquery>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
]
dev = [
    "ipykernel>=6.29",
    "jupytext>=1.16",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "sqlglot>=25",
]

[project.scripts]
partd-risk = "partd_risk.cli:app"

[project.urls]
Repository = "https://github.com/bravorod/medicare"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["dbt/dbt_packages", "dbt/target"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs dbt against a synthetic DuckDB warehouse (slow)",
]
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
]

[tool.coverage.run]
source = ["partd_risk"]
omit = ["src/partd_risk/cli.py"]
